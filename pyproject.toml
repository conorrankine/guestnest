[project]
name = "guestnest"
version = "0.1.0"
description = "generates candidate host–guest complex geometries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2025.03.5",
    "scipy>=1.15.2",
    "typer>=0.20.1",
]

[project.scripts]
guestnest = "guestnest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guestnest"]
